<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12372f"><title>Waterworks Calendar</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<canvas id="effects" aria-hidden="true"></canvas>
<div id="app">
<header><div class="brand"><span class="droplet">◈</span><div><h1 id="site-title">Waterworks</h1><p>OPERATIONS CALENDAR <span id="connection">Connecting…</span></p></div></div><div class="clock"><strong id="clock"></strong><span id="weather"></span></div><nav><button id="previous" aria-label="Previous month">‹</button><button id="today">Today</button><button id="next" aria-label="Next month">›</button><button id="add">＋ Event</button><button id="samples">Samples <span id="sample-count"></span></button><button id="library">Files & media</button><button id="settings">⚙ Settings</button><button id="export">↓ Export</button><button id="logout" title="Sign out">↪</button></nav></header>
<section id="notice" aria-live="polite"></section>
<main id="calendars"></main>
<footer><div class="legend"><span class="dot sample"></span> Collection <span class="dot bottles"></span> Bottles <span class="dot deadline"></span> Deadline / verify <span class="dot payroll"></span> Payroll</div><div>Thursday → Wednesday duty <b id="current-worker"></b> <span id="sync"></span></div></footer>
<div id="media-panel" hidden></div>
</div>
<div id="dark" hidden><p>After hours</p><button id="wake">Wake for 30 minutes</button></div>
<dialog id="login"><form id="login-form"><span class="eyebrow">WEST JEFFERSON</span><h2>Waterworks Calendar</h2><p>Your calendar, samples, and crew in one place.</p><label>Administrator password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Open calendar</button><p id="login-error" role="alert"></p><small>Use the password set during installation.</small></form></dialog>
<dialog id="editor"><div class="modal-head"><h2 id="editor-title"></h2><button id="close-editor" aria-label="Close">×</button></div><div id="editor-body"></div></dialog>
<div id="keyboard" popover="manual" hidden><div class="keyboard-top"><span>Touch keyboard</span><button id="keyboard-close">Done ↓</button></div><div id="keys"></div></div>
<div id="toast" role="status" hidden></div>
</body></html>
