<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" width="860" height="660" role="img">
<style>
  text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; }
  .t { font-size: 20px; font-weight: bold; } .l { font-size: 13px; } .s { font-size: 11px; fill: #51606f; }
  .box { fill: #eef3f8; stroke: #1b2733; stroke-width: 1.5; } .scr { fill: #16212e; stroke: #1b2733; stroke-width: 2; }
  .pi { fill: #d7f0dc; stroke: #1b2733; stroke-width: 1.5; } .w { fill: #fff; }
  .hdmi { stroke: #2166c4; stroke-width: 3; fill: none; } .usb { stroke: #2f9e77; stroke-width: 3; fill: none; }
  .pwr { stroke: #c0392b; stroke-width: 3; fill: none; } .net { stroke: #7a5cc4; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
  .dim { stroke: #51606f; stroke-width: 1; fill: none; } .wt { fill: #fff; font-size: 15px; font-weight: bold; }
</style>
<rect width="860" height="660" class="w"/>
<text x="40" y="38" class="t">Wiring: one computer per screen (Variants A, C, D)</text>

<rect x="60" y="70" width="320" height="180" rx="6" class="scr"/><text x="220" y="155" text-anchor="middle" class="wt">Left touch screen</text><text x="220" y="178" text-anchor="middle" class="wt" style="font-weight:normal;font-size:13px">this month</text>
<rect x="150" y="320" width="140" height="60" rx="6" class="pi"/><text x="220" y="346" text-anchor="middle" class="l">Raspberry Pi 5</text><text x="220" y="364" text-anchor="middle" class="s">behind the monitor</text>
<rect x="310" y="330" width="70" height="40" rx="4" class="box"/><text x="345" y="354" text-anchor="middle" class="s">Pi power</text>
<path d="M180 320 V250" class="hdmi"/><text x="172" y="290" text-anchor="end" class="s">micro-HDMI to HDMI</text>
<path d="M260 250 V320" class="usb"/><text x="268" y="290" class="s">touch USB</text>
<path d="M310 350 H290" class="pwr"/>
<path d="M345 370 V450" class="pwr"/><path d="M100 250 V450" class="pwr"/><text x="108" y="420" class="s">monitor power</text>
<path d="M220 380 V520" class="net"/>
<rect x="480" y="70" width="320" height="180" rx="6" class="scr"/><text x="640" y="155" text-anchor="middle" class="wt">Right touch screen</text><text x="640" y="178" text-anchor="middle" class="wt" style="font-weight:normal;font-size:13px">next month</text>
<rect x="570" y="320" width="140" height="60" rx="6" class="pi"/><text x="640" y="346" text-anchor="middle" class="l">Raspberry Pi 5</text><text x="640" y="364" text-anchor="middle" class="s">behind the monitor</text>
<rect x="730" y="330" width="70" height="40" rx="4" class="box"/><text x="765" y="354" text-anchor="middle" class="s">Pi power</text>
<path d="M600 320 V250" class="hdmi"/><text x="592" y="290" text-anchor="end" class="s">micro-HDMI to HDMI</text>
<path d="M680 250 V320" class="usb"/><text x="688" y="290" class="s">touch USB</text>
<path d="M730 350 H710" class="pwr"/>
<path d="M765 370 V450" class="pwr"/><path d="M520 250 V450" class="pwr"/><text x="528" y="420" class="s">monitor power</text>
<path d="M640 380 V520" class="net"/>
<rect x="60" y="450" width="740" height="34" rx="4" class="box"/><text x="430" y="472" text-anchor="middle" class="l">Surge protector (one wall outlet)</text>
<rect x="250" y="520" width="360" height="54" rx="6" class="box"/><text x="430" y="543" text-anchor="middle" class="l">Plant network: OpsBoard server on Proxmox</text><text x="430" y="561" text-anchor="middle" class="s">also reached by your PC and phone</text>
<g transform="translate(40,610)">
  <line x1="0" y1="0" x2="40" y2="0" class="hdmi"/><text x="48" y="4" class="l">HDMI (picture)</text>
  <line x1="180" y1="0" x2="220" y2="0" class="usb"/><text x="228" y="4" class="l">USB (touch)</text>
  <line x1="340" y1="0" x2="380" y2="0" class="pwr"/><text x="388" y="4" class="l">Power</text>
  <line x1="460" y1="0" x2="500" y2="0" class="net"/><text x="508" y="4" class="l">Network (Wi-Fi or Ethernet)</text>
</g>
<text x="40" y="640" class="s">With stick-on IR frames (Variant C) the frame's USB cable is the "touch USB" line.</text>
</svg>
