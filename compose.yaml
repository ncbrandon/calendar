services:
  calendar:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run python3 scripts/configure.py first}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      DATA_DIR: /data
    volumes:
      - calendar-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
volumes:
  calendar-data:
